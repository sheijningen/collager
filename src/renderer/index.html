<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file:; media-src 'self' file:; style-src 'self'"
    />
    <title>Collager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="toolbar">
      <button id="btn-panel" title="Show/hide file panel (P)">&#x2630;</button>
      <span id="app-title" title="About Collager (I)">Collager</span>
      <button id="btn-add" title="Add media files (A)">+ Add</button>
      <button
        id="btn-collage-menu"
        class="menu-btn"
        data-menu="collage-menu"
        title="Collage actions"
        aria-controls="collage-menu"
        aria-expanded="false"
      >
        Collage<span id="missing-badge" hidden>&#x26A0;</span><span class="caret">&#x25BE;</span>
      </button>
      <span id="scroll-control">
        <button id="btn-autoscroll" title="Toggle auto-scroll (Space)">&#x25B6; Auto</button>
        <button
          id="btn-scroll-menu"
          class="menu-btn"
          data-menu="scroll-menu"
          title="Auto-scroll settings"
          aria-haspopup="dialog"
          aria-controls="scroll-menu"
          aria-expanded="false"
        >
          <span class="caret">&#x25BE;</span>
        </button>
      </span>
      <span id="col-control" title="Number of columns (- / +)">
        <button id="btn-col-minus">&minus;</button>
        <span id="col-count">3</span><span class="col-label">col</span>
        <button id="btn-col-plus">+</button>
      </span>
      <button id="btn-fullscreen" title="Toggle fullscreen (F11)">&#x26F6;</button>
      <button id="btn-help" title="Keyboard shortcuts (F1)">?</button>
      <span id="item-count"></span>
      <span id="toolbar-hint"
        >drag &amp; drop media anywhere &middot; double-click to enlarge &middot; ? for
        shortcuts</span
      >
    </header>

    <div
      id="collage-menu"
      class="dropdown action-menu"
      role="group"
      aria-label="Collage actions"
      tabindex="-1"
      hidden
    >
      <button id="btn-shuffle">&#x1F500; Shuffle<kbd class="menu-key">S</kbd></button>
      <hr />
      <button id="btn-clear-missing" class="danger" hidden></button>
      <button id="btn-clear" class="danger">&#x1F5D1; Clear all</button>
    </div>

    <div
      id="scroll-menu"
      class="dropdown"
      role="dialog"
      aria-label="Auto-scroll settings"
      tabindex="-1"
      hidden
    >
      <label class="dropdown-row" title="Scroll speed (, / .)">
        <span>Speed</span>
        <input type="range" id="scroll-speed" min="10" max="600" step="10" />
        <span id="scroll-speed-value"></span>
      </label>
      <label class="dropdown-row" title="Jump back to the top after reaching the end">
        <input type="checkbox" id="scroll-loop" /> Restart at the end
      </label>
      <label class="dropdown-row" title="Re-shuffle the collage on each restart">
        <input type="checkbox" id="scroll-shuffle" /> Shuffle on restart
      </label>
      <label class="dropdown-row" title="Prevent the display from sleeping while auto-scrolling">
        <input type="checkbox" id="scroll-awake" /> Keep the display awake
      </label>
    </div>

    <button id="btn-toolbar-toggle" title="Show/hide toolbar">&#x25B4;</button>

    <div id="workspace">
      <aside id="panel">
        <div id="panel-header">
          <span id="panel-title">Files</span>
          <select id="sort-select" title="Sort the file list">
            <option value="added">Collage order</option>
            <option value="name">Name</option>
            <option value="path">Path</option>
            <option value="type">Type</option>
          </select>
        </div>
        <ul id="file-list"></ul>
        <div id="panel-footer">
          <button id="btn-remove-selected" disabled>Remove (0)</button>
          <span id="panel-hint">click: select &middot; ctrl: toggle &middot; shift: range</span>
        </div>
      </aside>
      <main id="scroller">
        <div id="collage"></div>
        <div id="empty-state" hidden>
          <p>Drop images (png/jpeg/webp), gifs or videos (mp4/webm) here</p>
          <p class="sub">or use the + Add button</p>
        </div>
      </main>
    </div>

    <div id="drop-overlay" hidden><span>Drop to add</span></div>

    <div id="lightbox" hidden>
      <div id="lightbox-content"></div>
    </div>

    <div id="help-overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2>Keyboard shortcuts</h2>
        <table id="shortcut-list"></table>
      </div>
    </div>

    <div id="about-overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2 id="about-name">Collager</h2>
        <p id="about-version"></p>
        <p id="about-desc"></p>
        <dl id="about-meta"></dl>
      </div>
    </div>

    <div id="ctx-menu" hidden>
      <div id="ctx-path"></div>
      <button id="ctx-copy">Copy path</button>
      <button id="ctx-reveal">Show in folder</button>
    </div>

    <div id="toast" hidden></div>

    <script type="module" src="ui/app.js"></script>
  </body>
</html>
