<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file:; media-src 'self' file:; style-src 'self'"
    />
    <title>Collager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="toolbar">
      <button id="btn-panel" title="Show/hide file panel (P)">&#x2630;</button>
      <span id="app-title" title="About Collager (I)">Collager</span>
      <button id="btn-add" title="Add media files">+ Add</button>
      <button id="btn-shuffle" title="Shuffle the collage">&#x1F500; Shuffle</button>
      <button id="btn-clear" title="Remove all media from the collage">&#x1F5D1; Clear all</button>
      <button id="btn-clear-missing" title="Remove every file that failed to load" hidden></button>
      <span id="col-control" title="Number of columns">
        <button id="btn-col-minus">&minus;</button>
        <span id="col-count">3</span> col
        <button id="btn-col-plus">+</button>
      </span>
      <span id="scroll-control">
        <button id="btn-autoscroll" title="Toggle auto-scroll">&#x25B6; Auto</button>
        <input type="range" id="scroll-speed" min="10" max="600" step="10" title="Scroll speed" />
        <label title="Jump back to the top after reaching the end">
          <input type="checkbox" id="scroll-loop" /> restart
        </label>
        <label title="Re-shuffle the collage on each restart">
          <input type="checkbox" id="scroll-shuffle" /> shuffle
        </label>
        <label title="Prevent the display from sleeping while auto-scrolling">
          <input type="checkbox" id="scroll-awake" /> keep awake
        </label>
      </span>
      <button id="btn-fullscreen" title="Toggle fullscreen (F11)">&#x26F6;</button>
      <button id="btn-help" title="Keyboard shortcuts (F1)">?</button>
      <span id="item-count"></span>
      <span id="toolbar-hint"
        >drag &amp; drop media anywhere &middot; double-click to enlarge &middot; ? for
        shortcuts</span
      >
    </header>

    <button id="btn-toolbar-toggle" title="Show/hide toolbar">&#x25B4;</button>

    <div id="workspace">
      <aside id="panel">
        <div id="panel-header">
          <span id="panel-title">Files</span>
          <select id="sort-select" title="Sort the file list">
            <option value="added">Collage order</option>
            <option value="name">Name</option>
            <option value="path">Path</option>
            <option value="type">Type</option>
          </select>
        </div>
        <ul id="file-list"></ul>
        <div id="panel-footer">
          <button id="btn-remove-selected" disabled>Remove (0)</button>
          <span id="panel-hint">click: select &middot; ctrl: toggle &middot; shift: range</span>
        </div>
      </aside>
      <main id="scroller">
        <div id="collage"></div>
        <div id="empty-state" hidden>
          <p>Drop images (png/jpeg/webp), gifs or videos (mp4/webm) here</p>
          <p class="sub">or use the + Add button</p>
        </div>
      </main>
    </div>

    <div id="drop-overlay" hidden><span>Drop to add</span></div>

    <div id="lightbox" hidden>
      <div id="lightbox-content"></div>
    </div>

    <div id="help-overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2>Keyboard shortcuts</h2>
        <table id="shortcut-list"></table>
      </div>
    </div>

    <div id="about-overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2 id="about-name">Collager</h2>
        <p id="about-version"></p>
        <p id="about-desc"></p>
        <dl id="about-meta"></dl>
      </div>
    </div>

    <div id="ctx-menu" hidden>
      <div id="ctx-path"></div>
      <button id="ctx-open">Open in lightbox</button>
      <button id="ctx-open-external">Open with default app</button>
      <button id="ctx-copy">Copy path</button>
      <button id="ctx-copy-image">Copy image</button>
      <button id="ctx-reveal">Show in folder</button>
      <button id="ctx-remove" class="danger">Remove from collage</button>
    </div>

    <div id="toast" hidden></div>

    <!-- classic scripts sharing one global scope; order is load-bearing -->
    <script src="core/layout.js"></script>
    <script src="core/selection.js"></script>
    <script src="core/prefs.js"></script>
    <script src="ui/state.js"></script>
    <script src="ui/collage.js"></script>
    <script src="ui/panel.js"></script>
    <script src="ui/ctxmenu.js"></script>
    <script src="ui/tiledrag.js"></script>
    <script src="ui/lightbox.js"></script>
    <script src="ui/autoscroll.js"></script>
    <script src="ui/shortcuts.js"></script>
    <script src="ui/app.js"></script>
  </body>
</html>
