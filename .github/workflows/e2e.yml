name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  e2e:
    name: e2e ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            # pinned: the apt package names below are specific to this Ubuntu release
            runner: ubuntu-24.04
          - name: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pnpm version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install a virtual display, ffmpeg (video fixture) and Electron's runtime libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb ffmpeg libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0t64
      - name: Install ffmpeg (video fixture)
        if: matrix.name == 'windows'
        run: choco install ffmpeg -y --no-progress
      - name: Download the Electron binary
        # pnpm skips Electron's postinstall; running it here puts the binary (and
        # its sandbox helper) in place before the next step touches it
        run: node node_modules/electron/install.js
      - name: Make Chromium's setuid sandbox helper usable
        if: matrix.name == 'linux'
        # Ubuntu 24.04 restricts unprivileged user namespaces, so Chromium falls
        # back to its setuid helper, which must be root-owned with mode 4755
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run the suite under a virtual display
        if: matrix.name == 'linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" pnpm test:e2e
      - name: Run the suite on the runner's desktop
        if: matrix.name == 'windows'
        run: pnpm test:e2e
